[package]
name = "s04-fsscan"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
publish = false
description = "Spike S-04 (roadmap 1.7): NTFS enumeration methods measured side by side. Never shipped."

# Standalone: not a member of the product workspace, so its dependencies never reach Cargo.lock
# or cargo-deny there.
[workspace]

[[bin]]
name = "fsscan"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Threading",
] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
cast_possible_truncation = "allow" # sizes from the OS fit; a spike, not product code
cast_precision_loss = "allow"      # report formatting only

[profile.release]
panic = "abort"
