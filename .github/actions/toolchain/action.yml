# Loads the toolchain image(s) into the local daemon under the tags compose.yaml expects
# (ADR-0003). When .github/toolchain.lock pins images built from this docker/build.Dockerfile,
# they're pulled from GHCR by digest (a private package, decision #29). Otherwise (a change to the
# Dockerfile, nothing pinned yet, or a token that can't read the package) they're built from
# source with the GitHub Actions layer cache, unless `pinned` is `require`.
name: toolchain
description: Load the DISM Pro toolchain images for docker compose
inputs:
  t2:
    description: Also load the Wine (T2) image
    default: "false"
  pinned:
    description: >-
      `prefer` pulls the pinned images and builds when it can't; `require` fails instead of
      building, for builds that must use the published toolchain (releases)
    default: prefer
  token:
    description: "A token that can read the GHCR package (the job needs `packages: read`)"
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - name: Pull the pinned images
      id: pull
      shell: bash
      env:
        T2: ${{ inputs.t2 }}
        PINNED: ${{ inputs.pinned }}
        TOKEN: ${{ inputs.token }}
        ACTOR: ${{ github.actor }}
      run: |
        set -euo pipefail
        [[ $PINNED == prefer || $PINNED == require ]] || { echo "::error::pinned must be prefer or require, not $PINNED"; exit 1; }
        targets=(t1)
        if [[ $T2 == true ]]; then targets+=(t2); fi
        status=0
        if printf '%s' "$TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin >/dev/null; then
          bash .github/scripts/toolchain-images.sh pull "${targets[@]}" || status=$?
          docker logout ghcr.io >/dev/null || true
        else
          echo "::warning title=toolchain images::couldn't log in to ghcr.io"
          status=4
        fi
        case $status in
          0) echo "pulled=true" >> "$GITHUB_OUTPUT" ;;
          3 | 4)
            if [[ $PINNED == require ]]; then
              echo "::error title=toolchain images::this job must use the pinned toolchain images (pinned: require)"
              exit 1
            fi
            echo "::notice title=toolchain images::building ${targets[*]} from source"
            echo "pulled=false" >> "$GITHUB_OUTPUT"
            ;;
          *) exit "$status" ;;
        esac
    - if: steps.pull.outputs.pulled != 'true'
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - name: Build t1
      if: steps.pull.outputs.pulled != 'true'
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: ./docker
        file: ./docker/build.Dockerfile
        target: t1
        tags: dism-pro-build:t1-local
        load: true
        cache-from: type=gha,scope=t1
        cache-to: type=gha,scope=t1,mode=max
    - name: Build t2
      if: steps.pull.outputs.pulled != 'true' && inputs.t2 == 'true'
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: ./docker
        file: ./docker/build.Dockerfile
        target: t2
        tags: dism-pro-build:t2-local
        load: true
        cache-from: |
          type=gha,scope=t1
          type=gha,scope=t2
        cache-to: type=gha,scope=t2,mode=max
