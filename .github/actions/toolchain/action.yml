# Builds the toolchain image(s) from docker/build.Dockerfile into the local daemon under the
# tags compose.yaml expects, with the GitHub Actions layer cache (ADR-0003).
name: toolchain
description: Build the DISM Pro toolchain images for docker compose
inputs:
  t2:
    description: Also build the Wine (T2) image
    default: "false"
runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - name: Build t1
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: ./docker
        file: ./docker/build.Dockerfile
        target: t1
        build-args: XWIN_ACCEPT_LICENSE=1
        tags: dism-pro-build:t1-local
        load: true
        cache-from: type=gha,scope=t1
        cache-to: type=gha,scope=t1,mode=max
    - name: Build t2
      if: inputs.t2 == 'true'
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: ./docker
        file: ./docker/build.Dockerfile
        target: t2
        build-args: XWIN_ACCEPT_LICENSE=1
        tags: dism-pro-build:t2-local
        load: true
        cache-from: |
          type=gha,scope=t1
          type=gha,scope=t2
        cache-to: type=gha,scope=t2,mode=max
