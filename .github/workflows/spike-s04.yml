# Spike S-04 (roadmap 1.7): NTFS enumeration methods on a 1.2 M-file corpus, measured on the
# windows-2025 runner VM. Throwaway: lives on spike/s04* branches only and is never merged.
name: spike-s04

on:
  push:
    branches: ["spike/s04*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build fsscan (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain
      - name: test, lint, build (x64 + ARM64)
        run: >-
          docker compose run --rm -e CARGO_TARGET_DIR=/src/target/s04 --entrypoint bash test -c
          'set -e; cd spikes/s04-fsscan;
          cargo test --locked;
          cargo xwin clippy --locked --all-targets --target x86_64-pc-windows-msvc -- -D warnings;
          cargo xwin build --locked --release --target x86_64-pc-windows-msvc --target aarch64-pc-windows-msvc;
          mkdir -p /src/dist-s04;
          cp /src/target/s04/x86_64-pc-windows-msvc/release/fsscan.exe /src/dist-s04/fsscan-x64.exe;
          cp /src/target/s04/aarch64-pc-windows-msvc/release/fsscan.exe /src/dist-s04/fsscan-arm64.exe'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fsscan
          path: dist-s04/
          if-no-files-found: error
          retention-days: 7

  measure:
    name: measure (windows-2025 VM)
    needs: build
    runs-on: windows-2025
    timeout-minutes: 150
    defaults:
      run:
        shell: pwsh
    env:
      FSSCAN: dist-s04/fsscan-x64.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fsscan
          path: dist-s04/
      - name: setup (corpus volume)
        run: ./.github/scripts/spike-s04.ps1 -Step Setup
      - name: corpus (1.2 M files)
        run: ./.github/scripts/spike-s04.ps1 -Step Corpus
      - name: bench warm
        if: always()
        run: ./.github/scripts/spike-s04.ps1 -Step Warm
      - name: bench cold
        if: always()
        run: ./.github/scripts/spike-s04.ps1 -Step Cold
      - name: stale-plan detection
        if: always()
        run: ./.github/scripts/spike-s04.ps1 -Step Fingerprint
      - name: system volume
        if: always()
        run: ./.github/scripts/spike-s04.ps1 -Step System
      - name: container probe
        if: always()
        run: ./.github/scripts/spike-s04.ps1 -Step Container
