# Throwaway diagnosis of the T3 offline smoke failure (run 41134716846). Lives on diag/** only.
name: t3-diag

on:
  push:
    branches: ["diag/**"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  diag:
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
          run-id: 41134716846
          github-token: ${{ github.token }}
      - name: offline image
        run: ./.github/scripts/offline-image.ps1 -Out "$env:RUNNER_TEMP\t3-image"
      - name: diagnose
        run: ./.github/scripts/t3-diag.ps1 -Cli dist/x86_64-pc-windows-msvc/dismpro-cli.exe -Image "$env:RUNNER_TEMP\t3-image"
