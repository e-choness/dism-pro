# CI on the GitHub Actions free tier (ADR-0003, decision #16). Every job runs the same
# `docker compose run` services a developer runs locally.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    # spike/** branches get every job, Windows included, without a PR (roadmap spikes).
    branches: [master, "spike/**"]
  schedule:
    - cron: "17 3 * * *" # nightly
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    name: T1 + T2 (ubuntu)
    # Adding a label other than needs-windows doesn't need a new run.
    if: github.event.action != 'labeled' || github.event.label.name == 'needs-windows'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain
        with:
          t2: "true"
      - run: docker compose run --rm fmt
      - run: docker compose run --rm lint
      - run: docker compose run --rm test
      - run: docker compose run --rm test-win
      - run: docker compose run --rm deny
      - run: docker compose run --rm build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  windows:
    name: T3 + G1 (windows-2025)
    needs: linux
    # Windows minutes are scarce: master, nightly, manual, or PRs labeled needs-windows.
    if: >-
      github.event_name == 'push' || github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'needs-windows')
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: T3 integration tests
        if: hashFiles('compose.windows.yaml') != ''
        run: docker compose -f compose.windows.yaml run --rm itest
      - name: T3 not set up yet
        if: hashFiles('compose.windows.yaml') == ''
        run: echo "::notice::compose.windows.yaml lands with spike S-02 (roadmap 1.5); no T3 tests yet."
      - name: CLI smoke (runner VM, online target)
        # Real DISM calls, a feature change and its undo on the throwaway runner VM.
        shell: pwsh
        run: ./.github/scripts/smoke-online.ps1 -Cli dist/x86_64-pc-windows-msvc/dismpro-cli.exe

  adk-headers:
    name: ADK DISM API headers (windows-2025)
    # dismapi.h ships with the Windows ADK, not the SDK in the toolchain image (decision #22).
    # Only the headers leave this job, as a short-lived private artifact; never committed.
    if: >-
      github.event_name == 'push' || github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'needs-windows')
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      # https://learn.microsoft.com/windows-hardware/get-started/adk-install: "Download the Windows
      # ADK 10.1.26100.9457 (September 2026)". Bump both together; the version keys the cache.
      ADK_VERSION: 10.1.26100.9457
      ADK_URL: https://go.microsoft.com/fwlink/?linkid=2289980
    steps:
      - id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: adk-include
          key: adk-headers-${{ env.ADK_VERSION }}
      - name: Find or install ADK Deployment Tools
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $kits = "${env:ProgramFiles(x86)}\Windows Kits\10"
          $adk = Join-Path $kits 'Assessment and Deployment Kit'
          function Find-Header($dir, $name) {
            Get-ChildItem -Path $dir -Recurse -Filter $name -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending | Select-Object -First 1
          }
          $dism = Find-Header $adk dismapi.h
          if (-not $dism) {
            # Microsoft's own installer, checked for a valid Microsoft signature before it runs.
            $setup = Join-Path $env:RUNNER_TEMP adksetup.exe
            Invoke-WebRequest -Uri $env:ADK_URL -OutFile $setup
            $sig = Get-AuthenticodeSignature $setup
            if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch '^CN=Microsoft Corporation,') {
              throw "adksetup.exe signature: $($sig.Status), $($sig.SignerCertificate.Subject)"
            }
            $log = Join-Path $env:RUNNER_TEMP adksetup.log
            $p = Start-Process -FilePath $setup -Wait -PassThru -ArgumentList `
              '/quiet', '/norestart', '/ceip', 'off', '/features', 'OptionId.DeploymentTools', '/log', $log
            Write-Host "adksetup.exe exit code: $($p.ExitCode)"
            $dism = Find-Header $adk dismapi.h
            if (-not $dism) {
              Get-ChildItem "$env:RUNNER_TEMP\adksetup*.log" -ErrorAction SilentlyContinue |
                ForEach-Object { Write-Host "--- $($_.Name)"; Get-Content $_ -Tail 60 }
              throw "dismapi.h not found under $adk after installing the ADK"
            }
          }
          # wimgapi.h ships with the Windows SDK (installed on the runner), not the ADK.
          $wim = (Find-Header $adk wimgapi.h) ?? (Find-Header (Join-Path $kits Include) wimgapi.h)
          if (-not $wim) { throw "wimgapi.h not found under $kits" }
          New-Item -ItemType Directory -Force adk-include | Out-Null
          Copy-Item (Join-Path $dism.DirectoryName '*.h'), $wim.FullName adk-include
          Get-ChildItem adk-include | Format-Table Name, Length
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: adk-include
          path: adk-include/
          if-no-files-found: error
          retention-days: 1

  ffi-check:
    name: S-03 header cross-check (ubuntu)
    needs: adk-headers
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: adk-include
          path: .adk-include/
      - run: docker compose run --rm ffi-check
        env:
          DPRO_FFI_INCLUDE: /src/.adk-include
