# CI on the GitHub Actions free tier (ADR-0003, decision #16). Every job runs the same
# `docker compose run` services a developer runs locally.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    # spike/** branches get every job, Windows included, without a PR (roadmap spikes).
    branches: [master, "spike/**"]
  schedule:
    - cron: "17 3 * * *" # nightly
  workflow_dispatch:

permissions:
  contents: read
  packages: read # the pinned toolchain images (decision #29)

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    name: T1 + T2 (ubuntu)
    # Adding a label other than needs-windows doesn't need a new run.
    if: github.event.action != 'labeled' || github.event.label.name == 'needs-windows'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain
        with:
          t2: "true"
      # The MSVC CRT + Windows SDK, from Microsoft at the pinned versions and checked by hash. CI
      # never stores them (images, caches, artifacts): they aren't redistributable (decision #5).
      - run: docker compose run --rm xwin
      - run: docker compose run --rm fmt
      - run: docker compose run --rm lint
      - run: docker compose run --rm test
      # Doc 04 §3's deterministic gate: instruction counts vs benches/baseline.json.
      - run: docker compose run --rm bench-gate
      - run: docker compose run --rm test-win
      - run: docker compose run --rm deny
      - run: docker compose run --rm build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
      # Dev tools for T3 (never shipped): see docker/task.sh.
      - run: docker compose run --rm t3-tools
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: t3-tools
          path: dist-t3/
          if-no-files-found: error
          retention-days: 7

  windows:
    name: T3 + G1 (windows-2025)
    needs: linux
    # Windows minutes are scarce: master, nightly, manual, or PRs labeled needs-windows.
    if: >-
      github.event_name == 'push' || github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'needs-windows')
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: t3-tools
          path: dist-t3/
      - name: CLI smoke (runner VM, online target)
        # Real DISM calls, a feature change and its undo on the throwaway runner VM.
        shell: pwsh
        run: ./.github/scripts/smoke.ps1 -Cli dist/x86_64-pc-windows-msvc/dismpro-cli.exe
      - name: T3 crash dumps (dpro-win tests on real Windows)
        # T2 runs them under Wine; this is the real dbghelp.dll and exception dispatch.
        shell: pwsh
        run: |
          $out = & dist-t3/dpro-win-tests.exe crash:: --test-threads 1 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          $kind = if ($code) { 'error' } else { 'notice' }
          $text = $out.Trim().Replace('%', '%25').Replace("`r", '').Replace("`n", '%0A')
          Write-Host "::$kind title=dpro-win crash tests (real Windows, exit $code)::$text"
          exit $code
      - name: T3 broker pipe (dpro-win + dpro-broker tests, probe, MCP end to end)
        # Round-trip times against the budget, plus what Wine can't show: the integrity label,
        # remote and squatter refusal, the admin-only policy file read elevated, and an MCP front
        # starting the broker and calling every tool with the release CLI (roadmap 2.7).
        # A hung accept must not eat the job.
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        shell: pwsh
        run: |
          $env:DISMPRO_CLI = (Resolve-Path dist/x86_64-pc-windows-msvc/dismpro-cli.exe).Path
          $failed = 0
          foreach ($run in @(
              @{ Title = 'dpro-win pipe, security and elevation tests'; Exe = 'dist-t3/dpro-win-tests.exe'; Args = @('pipe::', 'security::', 'elevate::', 'system::', '--test-threads', '1') },
              @{ Title = 'dpro-broker tests'; Exe = 'dist-t3/dpro-broker-tests.exe'; Args = @('--test-threads', '1') },
              @{ Title = 'broker pipe probe'; Exe = 'dist-t3/pipe_t3.exe'; Args = @() },
              @{ Title = 'dismpro-cli MCP front and broker'; Exe = 'dist-t3/dismpro-cli-mcp-tests.exe'; Args = @('--test-threads', '1', '--nocapture') })) {
            $out = & $run.Exe @($run.Args) 2>&1 | Out-String
            $code = $LASTEXITCODE
            if ($code) { $failed++ }
            Write-Host $out
            $kind = if ($code) { 'error' } else { 'notice' }
            $text = $out.Trim().Replace('%', '%25').Replace("`r", '').Replace("`n", '%0A')
            Write-Host "::$kind title=$($run.Title) (real Windows, exit $code)::$text"
          }
          exit $failed
      - name: T3 GUI platform (window, DirectWrite)
        # What Wine only approximates: a real window station, and DirectWrite with Windows' fonts.
        # The output names the font families picked (TD-0009 §5.2).
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        shell: pwsh
        run: |
          $out = & dist-t3/dpro-win-tests.exe gui:: --test-threads 1 --nocapture 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          $kind = if ($code) { 'error' } else { 'notice' }
          $text = $out.Trim().Replace('%', '%25').Replace("`r", '').Replace("`n", '%0A')
          Write-Host "::$kind title=dpro-win GUI tests (real Windows, exit $code)::$text"
          exit $code
      - name: T3 accessibility adapter (UI Automation)
        # The vendored accesskit_windows's tests (TD-0009 A2.9): a real window, served to UIA's
        # client in this process. Upstream's tests, then the patterns DISM Pro adds.
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        shell: pwsh
        run: |
          $out = & dist-t3/accesskit-windows-tests.exe --test-threads 1 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          $kind = if ($code) { 'error' } else { 'notice' }
          $text = $out.Trim().Replace('%', '%25').Replace("`r", '').Replace("`n", '%0A')
          Write-Host "::$kind title=accesskit_windows tests (real Windows, exit $code)::$text"
          exit $code
      - name: G1 UI gates (startup, idle)
        # TD-0009 §7 against bare_window in this job: U4 startup <= 3x, U6 no timer or paint once
        # settled, U7 idle working set <= 40 MiB.
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        shell: pwsh
        run: ./.github/scripts/ui-gates.ps1 -Bin dist-t3 -Out ui-gates
      - name: G1 reports and popup screenshots
        # The probes' raw reports, and the popups as the screen shows them: TD-0009 A1.3's DWM
        # shadow and small rounded corners are checked by hand. Only the toolkit's own pixels and
        # numbers, no Microsoft files (decision #29).
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-gates
          path: ui-gates/
          if-no-files-found: warn
          retention-days: 7
      - name: T3 WIMGAPI (wim_t3 probe)
        # Wine has no wimgapi.dll: WimFile against WIMs and an ESD that dism.exe captures (roadmap 2.3).
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        shell: pwsh
        run: |
          $out = & dist-t3/wim_t3.exe 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          $kind = if ($code) { 'error' } else { 'notice' }
          $text = $out.Trim().Replace('%', '%25').Replace("`r", '').Replace("`n", '%0A')
          Write-Host "::$kind title=WIMGAPI probe (real Windows, exit $code)::$text"
          exit $code
      - name: Servicing stamps (TD-0013 §7.1 package-list cache, advisory)
        # Which stamps move on a feature change and its undo, and which stay put on reads and idle
        # time. A measurement for the cache design, not a gate.
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 15
        shell: pwsh
        run: ./.github/scripts/servicing-stamps.ps1 -Cli dist/x86_64-pc-windows-msvc/dismpro-cli.exe
      - name: T3 offline image (servercore base layer)
        # On the VM, not in a container: S-02 found DISM can't service images inside one.
        id: image
        shell: pwsh
        run: ./.github/scripts/offline-image.ps1 -Out "$env:RUNNER_TEMP\t3-image"
      - name: T3 hive reader vs offreg.dll (offline image)
        # ADR-0008: every key and value of the untouched image's hives, read both ways.
        shell: pwsh
        run: ./.github/scripts/regf-check.ps1 -Dump dist-t3/regf_dump.exe -Image "$env:RUNNER_TEMP\t3-image"
      - name: T3 CLI smoke (offline image)
        shell: pwsh
        run: ./.github/scripts/smoke.ps1 -Cli dist/x86_64-pc-windows-msvc/dismpro-cli.exe -Target "$env:RUNNER_TEMP\t3-image"
      - name: T3 driver calls (online + offline image)
        # Lists drivers both ways, then stages, removes and re-adds a test package in the
        # image (roadmap 2.5). Runs even if the CLI smoke failed: it only needs the image.
        if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        shell: pwsh
        run: |
          $failed = 0
          foreach ($mode in @('online'), @('offline', "$env:RUNNER_TEMP\t3-image")) {
            $out = & dist-t3/drivers_t3.exe @mode 2>&1 | Out-String
            $code = $LASTEXITCODE
            if ($code) { $failed++ }
            Write-Host $out
            $kind = if ($code) { 'error' } else { 'notice' }
            $text = $out.Trim().Replace('%', '%25').Replace("`r", '').Replace("`n", '%0A')
            Write-Host "::$kind title=DISM driver calls, $($mode[0]) (exit $code)::$text"
          }
          exit $failed

  health:
    # TD-0006 §10 (roadmap 2.6): the full scan and the repair take minutes each, so they run next to
    # the T3 job instead of lengthening it. Same triggers as T3.
    name: T3 health (windows-2025)
    needs: linux
    if: >-
      github.event_name == 'push' || github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'needs-windows')
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Health scan (runner VM, online target)
        shell: pwsh
        run: ./.github/scripts/smoke.ps1 -Health -Cli dist/x86_64-pc-windows-msvc/dismpro-cli.exe
      - name: T3 offline image (servercore base layer)
        id: image
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./.github/scripts/offline-image.ps1 -Out "$env:RUNNER_TEMP\t3-image"
      - name: T3 health scan and restore (offline image)
        if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        shell: pwsh
        run: ./.github/scripts/smoke.ps1 -Health -Cli dist/x86_64-pc-windows-msvc/dismpro-cli.exe -Target "$env:RUNNER_TEMP\t3-image"

  smoke-arm64:
    name: CLI smoke (windows-11-arm)
    needs: linux
    # The ARM64 build on real ARM64 Windows; same triggers as the x64 Windows job.
    if: >-
      github.event_name == 'push' || github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'needs-windows')
    runs-on: windows-11-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: CLI smoke (runner VM, online target)
        shell: pwsh
        run: ./.github/scripts/smoke.ps1 -Cli dist/aarch64-pc-windows-msvc/dismpro-cli.exe

  adk:
    name: S-03 headers + WinPE file lists (windows-2025)
    # dismapi.h ships with the Windows ADK (decision #22), so the S-03 header cross-check runs
    # here: the linux job's t3-tools bring the checks (ffi-check-source), and only pass or fail
    # leaves this VM, never a Microsoft header. The WinPE add-on gives the DLL names behind the
    # pe-compat allowlist; only those names leave, as a short-lived artifact.
    needs: linux
    if: >-
      github.event_name == 'push' || github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'needs-windows')
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      # https://learn.microsoft.com/windows-hardware/get-started/adk-install: "Download the Windows
      # ADK 10.1.26100.9457 (September 2026)" and its WinPE add-on. Bump all three together; the
      # version keys the caches.
      ADK_VERSION: 10.1.26100.9457
      ADK_URL: https://go.microsoft.com/fwlink/?linkid=2289980
      WINPE_URL: https://go.microsoft.com/fwlink/?linkid=2289981
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: t3-tools
          path: dist-t3/
      # Derived names only; the ADK's own files are never cached.
      - id: winpe
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: winpe-files
          key: winpe-files-${{ env.ADK_VERSION }}
      - name: S-03 header cross-check
        run: ./.github/scripts/adk.ps1 -Check dist-t3/ffi-check-source.exe
      - name: WinPE file lists
        if: steps.winpe.outputs.cache-hit != 'true'
        run: ./.github/scripts/adk.ps1 -WinPE winpe-files
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: winpe-files
          path: winpe-files/
          if-no-files-found: error
          retention-days: 1

  winpe-allowlist:
    name: WinPE allowlist (ubuntu)
    needs: adk
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: winpe-files
          path: .winpe-files/
      # Needs no Windows target, so no CRT/SDK download (the entrypoint skips task.sh).
      - name: WinPE allowlist evidence
        run: docker compose run --rm --entrypoint cargo ffi-check xtask pe-compat --winpe-files /src/.winpe-files
