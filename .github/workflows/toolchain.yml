# Publishes the toolchain images to GHCR (ADR-0003). After a publish, a follow-up
# `build(docker): …` PR pins compose.yaml to the digests printed in the job summary.
name: toolchain

on:
  push:
    branches: [master]
    paths: [docker/**]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      matrix:
        target: [t1, t2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./docker
          file: ./docker/build.Dockerfile
          target: ${{ matrix.target }}
          build-args: XWIN_ACCEPT_LICENSE=1
          tags: ghcr.io/e-choness/dism-pro-build:${{ matrix.target }}-${{ github.sha }}
          push: true
          cache-from: |
            type=gha,scope=t1
            type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,scope=${{ matrix.target }},mode=max
      - name: Digest for compose.yaml
        env:
          TARGET: ${{ matrix.target }}
          REF: ghcr.io/e-choness/dism-pro-build@${{ steps.push.outputs.digest }}
        run: |
          echo "${TARGET}: \`${REF}\`" >> "$GITHUB_STEP_SUMMARY"
