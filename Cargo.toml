[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/e-choness/dism-pro"
publish = false

# New dependencies need a justification in the PR (coding standards §7).
[workspace.dependencies]
dpro-core = { path = "crates/dpro-core" }
dpro-app = { path = "crates/dpro-app" }
dpro-cli-fmt = { path = "crates/dpro-cli-fmt" }
dpro-engine = { path = "crates/dpro-engine" }
dpro-broker = { path = "crates/dpro-broker" }
dpro-mcp = { path = "crates/dpro-mcp" }
dpro-sys = { path = "crates/dpro-sys" }
dpro-win = { path = "crates/dpro-win" }
# Win32 FFI for dpro-win (coding standards §7: windows-sys over windows). MIT OR Apache-2.0.
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_IO",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Power",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# COM for dpro-win's GUI (TD-0009 §5.5): DirectWrite, the composition presenter (Direct3D 11,
# DXGI and DirectComposition, loaded at run time), and the UI Automation types that
# accesskit_windows shares (this release) and HIGHCONTRASTW. windows-sys has no COM interfaces.
# MIT OR Apache-2.0. Exact: the version S-01 built.
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_UI_Accessibility",
] }
# Already in the tree through `windows`; named directly because `#[implement]` (our DirectWrite
# renderer) expands to `windows_core::` paths. MIT OR Apache-2.0.
windows-core = "=0.62.2"
# Error enums per crate (coding standards §3). MIT OR Apache-2.0, proc-macro only.
thiserror = "2.0.21"
# Plan/JSON model (TD-0001 G1). MIT OR Apache-2.0.
serde = { version = "1.0.229", features = ["derive"] }
# Journal record encoding (TD-0001 §5.4). MIT OR Apache-2.0.
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
# CLI argument parsing (TD-0002 §5.5; small, no dependencies). MIT.
lexopt = "0.3.2"
# CLI JSON output (TD-0002 §5.4). MIT OR Apache-2.0.
serde_json = "1.0.154"
# The accessibility tree (TD-0009 §5.5): platform-neutral types that dpro-ui builds and
# accesskit_windows serves to UI Automation. MIT OR Apache-2.0. Exact: the version S-01 built.
accesskit = "=0.25.2"
# Serves that tree to UI Automation (TD-0009 §5.5), from dpro-win's GUI. Uses `windows` 0.62, the
# release dpro-win names. MIT OR Apache-2.0. Exact: the version S-01 built.
accesskit_windows = "=0.35.2"
# Dev/bench only.
criterion = "0.8.2"
# Bench only: instruction counts under Callgrind, the deterministic gate (doc 04 §3). Apache-2.0 OR
# MIT. Exact: it must match the gungraun-runner in docker/build.Dockerfile.
gungraun = "=0.20.0"
# Test only: counts allocations for the exact zero-allocations-per-frame gate (TD-0009 §7 U8), as a
# safe global allocator (no `unsafe` outside dpro-sys/dpro-win). MIT, no dependencies.
stats_alloc = "0.1.10"
proptest = "1.12.0"
# Dev only: the reference MCP client for conformance tests (TD-0013 §12), both protocol eras.
# Apache-2.0; never linked into a shipped binary.
rmcp = { version = "3.8.0", default-features = false, features = ["client", "transport-async-rw"] }
# Dev only: the runtime rmcp's client needs. MIT.
tokio = { version = "1.54.1", features = ["rt", "macros", "io-util"] }

# Coding standards §1. CI runs clippy with -D warnings, so "warn" lints also block merges.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
print_stdout = "deny"
undocumented_unsafe_blocks = "deny"
cast_possible_truncation = "deny"

[profile.release]
# A panic is a bug that produces a minidump (coding standards §3).
panic = "abort"

[profile.bench]
# gungraun finds the benchmark functions it counts through debug info. Opt-level stays release's.
debug = true
