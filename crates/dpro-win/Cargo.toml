[package]
name = "dpro-win"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
dpro-core.workspace = true
dpro-sys.workspace = true
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
windows = { workspace = true, optional = true }
windows-core = { workspace = true, optional = true }
accesskit = { workspace = true, optional = true }
accesskit_windows = { workspace = true, optional = true }

[features]
# The GUI's Win32 platform (TD-0009 §5.1): window, message loop, GDI presenter, DirectWrite text,
# UI Automation, G1 probes. dismpro.exe needs it; the CLI and the broker don't.
gui = ["dep:windows", "dep:windows-core", "dep:accesskit", "dep:accesskit_windows"]

# TD-0009 §7 U4, U6, U7: the raw-API window that G1's startup and idle ratios divide by.
[[example]]
name = "bare_window"
required-features = ["gui"]

[lints]
workspace = true
