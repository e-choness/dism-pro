[[bench]]
name = "table"
harness = false

# The same scenarios as instruction counts, for `docker compose run --rm bench-gate` (doc 04 §3).
# Not part of a plain `cargo bench`: it needs gungraun-runner and valgrind.
[[bench]]
name = "ir"
harness = false
bench = false

