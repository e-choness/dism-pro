[package]
name = "dpro-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
accesskit.workspace = true
dpro-app.workspace = true

# The Win32 platform the `platform` module adapts (TD-0009 §5.1).
[target.'cfg(windows)'.dependencies]
dpro-win = { workspace = true, features = ["gui"] }

[dev-dependencies]
criterion.workspace = true
gungraun.workspace = true
stats_alloc.workspace = true

# TD-0009 §7 U2: written before the toolkit core (measure-first).
[[bench]]
name = "interact"
harness = false

# TD-0009 §7 U12: the accessibility tree and its updates, written before the code.
[[bench]]
name = "a11y"
harness = false

# U2 as instruction counts, for `docker compose run --rm bench-gate` (doc 04 §3).
[[bench]]
name = "ir"
harness = false
bench = false

# TD-0009 §7 U4, U6, U7: G1's probe target until roadmap 3.2 gives dismpro.exe its shell. The
# benches' synthetic shell in a real window; `.github/scripts/ui-gates.ps1` measures it against
# dpro-win's bare_window.
[[example]]
name = "shell"

[lints]
workspace = true
