[package]
name = "dpro-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
accesskit.workspace = true
dpro-app.workspace = true
dpro-core.workspace = true

# The Win32 platform the `platform` module adapts (TD-0009 §5.1).
[target.'cfg(windows)'.dependencies]
dpro-win = { workspace = true, features = ["gui"] }

[dev-dependencies]
criterion.workspace = true
gungraun.workspace = true
# Focus restoration over generated rebuilds, A4.8's remove and restore operations, until a
# `ui_state` fuzz target exists (TD-0009 A4.9, slice 7c).
proptest.workspace = true
stats_alloc.workspace = true

# TD-0009 §7 U2: written before the toolkit core (measure-first).
[[bench]]
name = "interact"
harness = false

# TD-0009 §7 U12: the accessibility tree and its updates, written before the code.
[[bench]]
name = "a11y"
harness = false

# TD-0009 §7 U1: S-01's fling script on a 100k-row table, its frame times (A2.7).
[[bench]]
name = "fling"
harness = false

# U2 as instruction counts, for `docker compose run --rm bench-gate` (doc 04 §3).
[[bench]]
name = "ir"
harness = false
bench = false

# TD-0009 A3.7's U16: the drawer's open, slide and close, their frame times (slice 6d).
[[bench]]
name = "drawer_slide"
harness = false

# TD-0009 §7 U4, U6, U7: G1's probe target until roadmap 3.2 gives dismpro.exe its shell. The
# benches' synthetic shell in a real window; `.github/scripts/ui-gates.ps1` measures it against
# dpro-win's bare_window.
[[example]]
name = "shell"

# TD-0009 A3.9's G1 Drawer check and A3.7's U16: slice 6d's drawer page in a real window, driven
# by `.github/scripts/ui-gates.ps1`.
[[example]]
name = "drawer"

# TD-0009 A3.9's G1 Picker check and A3.7's U19: slice 6e's in-app picker in a real window over a
# real folder, listed off the UI thread; `.github/scripts/ui-gates.ps1` times it over 10,000
# folders.
[[example]]
name = "picker"

[lints]
workspace = true
