# The only entry point for build / lint / test / bench (ADR-0003).
#   docker compose run --rm <fmt|lint|test|test-win|bench|bench-gate|deny|build|xwin> [-- args]
#
# The toolchain images build from docker/build.Dockerfile (everything in it is pinned) on
# first use. CI pulls the same images by digest from GHCR instead (.github/toolchain.lock) and
# tags them as below; the package is private (decision #29). With access to it:
#   docker login ghcr.io && bash .github/scripts/toolchain-images.sh pull t1 t2
#
# The MSVC CRT + Windows SDK aren't in the images: the first task that targets Windows downloads
# them from Microsoft into the `xwin` volume, at the versions the Dockerfile pins (`xwin` does
# only that).

x-toolchain: &toolchain
  working_dir: /src
  volumes:
    - .:/src
    # target/ and the cargo caches live in named volumes, not the bind mount (fast on Windows hosts).
    - target:/src/target
    - cargo-registry:/usr/local/cargo/registry
    - cargo-git:/usr/local/cargo/git
    - sccache:/sccache
    - xwin:/opt/xwin
  environment: &env
    # Lets xtask turn failures into GitHub annotations (empty outside Actions).
    GITHUB_ACTIONS: ${GITHUB_ACTIONS:-}
    # Owner decision #5: the Microsoft CRT/SDK license is accepted for these builds. cargo-xwin
    # accepts it implicitly, so docker/task.sh downloads nothing without this explicit opt-in.
    XWIN_ACCEPT_LICENSE: "1"

x-t1: &t1
  <<: *toolchain
  image: dism-pro-build:t1-local
  build:
    context: ./docker
    dockerfile: build.Dockerfile
    target: t1

x-t2: &t2
  <<: *toolchain
  image: dism-pro-build:t2-local
  build:
    context: ./docker
    dockerfile: build.Dockerfile
    target: t2

services:
  fmt:
    <<: *t1
    entrypoint: ["bash", "/src/docker/task.sh", "fmt"]
  lint:
    <<: *t1
    entrypoint: ["bash", "/src/docker/task.sh", "lint"]
  test:
    <<: *t1
    entrypoint: ["bash", "/src/docker/task.sh", "test"]
  test-win:
    <<: *t2
    entrypoint: ["bash", "/src/docker/task.sh", "test-win"]
  bench:
    <<: *t1
    entrypoint: ["bash", "/src/docker/task.sh", "bench"]
  bench-gate:
    <<: *t1
    entrypoint: ["bash", "/src/docker/task.sh", "bench-gate"]
  deny:
    <<: *t1
    entrypoint: ["bash", "/src/docker/task.sh", "deny"]
  build:
    <<: *t1
    entrypoint: ["bash", "/src/docker/task.sh", "build"]
  t3-tools:
    <<: *t1
    entrypoint: ["bash", "/src/docker/task.sh", "t3-tools"]
  lock:
    <<: *t1
    entrypoint: ["bash", "/src/docker/task.sh", "lock"]
  xwin:
    <<: *t1
    entrypoint: ["bash", "/src/docker/task.sh", "xwin"]
  ffi-check:
    <<: *t1
    entrypoint: ["bash", "/src/docker/task.sh", "ffi-check"]
    environment:
      <<: *env
      # Extra header dirs inside the container, e.g. a bind-mounted ADK DismApi include dir.
      DPRO_FFI_INCLUDE: ${DPRO_FFI_INCLUDE:-}

volumes:
  target:
  cargo-registry:
  cargo-git:
  sccache:
  xwin:
